<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Minecraft Builder</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Logo section -->
        <div class="logo-section">
            <img src="assets/logo.png" alt="Mini Minecraft" class="logo">
        </div>

        <!-- Game board -->
        <div class="game-board" id="gameBoard">
            <!-- Grid squares will be generated by JavaScript -->
        </div>

        <!-- House button -->
        <div class="controls">
            <button class="house-button" id="houseButton">🏠 Build a House</button>
        </div>

        <!-- Instructions for kids -->
        <div class="instructions">
            <p>Click any square to build! 🎮</p>
            <p>Empty → Grass → Stone → Wood → Empty</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
