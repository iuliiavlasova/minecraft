<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Minecraft Builder</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Logo section -->
        <div class="logo-section">
            <img src="assets/logo.png" alt="Mini Minecraft" class="logo">
        </div>

        <!-- Main game area with side-by-side layout -->
        <div class="game-area">
            <!-- Left side: Building interface -->
            <div class="building-panel">
                <!-- Layer controls -->
                <div class="layer-controls">
                    <button class="layer-button" id="layerDownButton">⬇️ Layer Down</button>
                    <div class="layer-display">
                        <span class="layer-label">Layer</span>
                        <span class="layer-number" id="layerNumber">1</span>
                    </div>
                    <button class="layer-button" id="layerUpButton">⬆️ Layer Up</button>
                </div>

                <!-- Game board container with 3D effect -->
                <div class="game-board-container">
                    <div class="game-board" id="gameBoard">
                        <!-- Grid squares will be generated by JavaScript -->
                    </div>
                    <div class="layer-shadow"></div>
                </div>

                <!-- Main controls -->
                <div class="controls">
                    <button class="action-button house-button" id="houseButton">🏠 Build a House</button>
                    <button class="action-button clear-button" id="clearButton">🧽 Clear Layer</button>
                </div>
            </div>

            <!-- Right side: 3D Preview panel -->
            <div class="preview-panel">
                <div class="preview-header">
                    <h3>🏗️ 3D Preview</h3>
                    <p class="preview-subtitle">See your building from all layers!</p>
                </div>

                <div class="preview-container">
                    <div class="preview-3d" id="preview3D">
                        <!-- 3D preview will be generated by JavaScript -->
                    </div>
                    <div class="preview-controls">
                        <button class="preview-button" id="rotateButton">🔄 Rotate View</button>
                        <button class="preview-button" id="toggleLayersButton">👁️ Toggle Layers</button>
                    </div>
                </div>

                <!-- Layer legend -->
                <div class="layer-legend">
                    <h4>Layer Guide:</h4>
                    <div class="legend-items">
                        <div class="legend-item">
                            <div class="legend-color layer-1-color"></div>
                            <span>Layer 1-2: Foundation</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color layer-3-4-color"></div>
                            <span>Layer 3-4: Walls</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color layer-5-8-color"></div>
                            <span>Layer 5-8: Roof & Sky</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Block preview and instructions -->
        <div class="info-section">
            <div class="block-cycle-display">
                <p class="cycle-title">Click squares to cycle blocks:</p>
                <div class="block-preview-row">
                    <div class="block-preview empty-preview">Empty</div>
                    <span class="arrow">→</span>
                    <div class="block-preview grass-preview">Grass</div>
                    <span class="arrow">→</span>
                    <div class="block-preview stone-preview">Stone</div>
                    <span class="arrow">→</span>
                    <div class="block-preview wood-preview">Wood</div>
                    <span class="arrow">→</span>
                    <div class="block-preview diamond-preview">✨Diamond</div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
