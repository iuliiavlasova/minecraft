<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Minecraft Builder</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Logo section -->
        <div class="logo-section">
            <img src="assets/logo.png" alt="Mini Minecraft" class="logo">
        </div>

        <!-- Layer controls -->
        <div class="layer-controls">
            <button class="layer-button" id="layerDownButton">⬇️ Layer Down</button>
            <div class="layer-display">
                <span class="layer-label">Layer</span>
                <span class="layer-number" id="layerNumber">1</span>
            </div>
            <button class="layer-button" id="layerUpButton">⬆️ Layer Up</button>
        </div>

        <!-- Game board container with 3D effect -->
        <div class="game-board-container">
            <div class="game-board" id="gameBoard">
                <!-- Grid squares will be generated by JavaScript -->
            </div>
            <div class="layer-shadow"></div>
        </div>

        <!-- Main controls -->
        <div class="controls">
            <button class="action-button house-button" id="houseButton">🏠 Build a House</button>
            <button class="action-button clear-button" id="clearButton">🧽 Clear Layer</button>
        </div>

        <!-- Block preview and instructions -->
        <div class="info-section">
            <div class="block-cycle-display">
                <p class="cycle-title">Click squares to cycle blocks:</p>
                <div class="block-preview-row">
                    <div class="block-preview empty-preview">Empty</div>
                    <span class="arrow">→</span>
                    <div class="block-preview grass-preview">Grass</div>
                    <span class="arrow">→</span>
                    <div class="block-preview stone-preview">Stone</div>
                    <span class="arrow">→</span>
                    <div class="block-preview wood-preview">Wood</div>
                    <span class="arrow">→</span>
                    <div class="block-preview diamond-preview">✨Diamond</div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
